name: Snyk
on:
  push:
    branches:
      - actions
jobs:
  snyk-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Monitor
        run: snyk monitor --file=backend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
